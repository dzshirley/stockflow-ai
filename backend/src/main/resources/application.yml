spring:
  application:
    name: stockflow-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:stockflow}
    username: ${POSTGRES_USER:stockflow}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ${AI_PROVIDER:mock}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      timeout: ${AI_TIMEOUT:20s}
      max-retries: 0
      chat:
        model: ${AI_MODEL:gpt-4o-mini}
        max-tokens: ${AI_MAX_RESPONSE_TOKENS:1200}
        parallel-tool-calls: false
    tools:
      throw-exception-on-error: true
      resolution:
        fallback:
          enabled: false
      limits:
        max-calls-per-tool-default: 3
        max-total-tool-calls: ${AI_MAX_TOOL_CALLS:6}
        on-limit-exceeded: THROW

stockflow:
  business-analysis:
    retention-days: ${BUSINESS_ANALYSIS_RETENTION_DAYS:90}
    max-contribution-rows: ${BUSINESS_ANALYSIS_MAX_CONTRIBUTION_ROWS:50}
    prompt-version: ${BUSINESS_ANALYSIS_PROMPT_VERSION:business-analysis-v1}
  ai:
    provider: ${AI_PROVIDER:mock}
    max-question-length: ${AI_MAX_QUESTION_LENGTH:1000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}
    max-tool-calls: ${AI_MAX_TOOL_CALLS:6}
    max-response-characters: ${AI_MAX_RESPONSE_CHARACTERS:50000}
    pricing:
      version: ${AI_PRICING_VERSION:2026-10-22}
      model: ${AI_PRICING_MODEL:gpt-4o-mini}
      input-usd-per-million: ${AI_INPUT_USD_PER_MILLION:0.15}
      output-usd-per-million: ${AI_OUTPUT_USD_PER_MILLION:0.60}
    resilience:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      initial-backoff: ${AI_RETRY_INITIAL_BACKOFF:200ms}
      backoff-multiplier: ${AI_RETRY_BACKOFF_MULTIPLIER:2}
      max-backoff: ${AI_RETRY_MAX_BACKOFF:1s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=stockflow-api logger=%logger{36} message=%msg%n"
