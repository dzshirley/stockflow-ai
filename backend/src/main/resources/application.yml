spring:
  application:
    name: stockflow-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:stockflow}
    username: ${POSTGRES_USER:stockflow}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME:120000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ${AI_PROVIDER:mock}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      timeout: ${AI_TIMEOUT:20s}
      max-retries: 0
      chat:
        model: ${AI_MODEL:gpt-4o-mini}
        max-tokens: ${AI_MAX_RESPONSE_TOKENS:1200}
        parallel-tool-calls: false
    tools:
      throw-exception-on-error: true
      resolution:
        fallback:
          enabled: false
      limits:
        max-calls-per-tool-default: 3
        max-total-tool-calls: ${AI_MAX_TOOL_CALLS:6}
        on-limit-exceeded: THROW

stockflow:
  security:
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_FAILURE_WINDOW:15m}
      max-tracked-keys: ${LOGIN_MAX_TRACKED_KEYS:10000}
    registration-enabled: ${REGISTRATION_ENABLED:true}
  restock:
    freshness-window: ${RESTOCK_FRESHNESS_WINDOW:24h}
    execution-lease: ${RESTOCK_EXECUTION_LEASE:2m}
    recovery-delay: ${RESTOCK_RECOVERY_DELAY:30s}
    recovery-batch-size: ${RESTOCK_RECOVERY_BATCH_SIZE:100}
    target-cover-days: ${RESTOCK_TARGET_COVER_DAYS:30}
    max-quantity: ${RESTOCK_MAX_QUANTITY:1000000}
  business-analysis:
    retention-days: ${BUSINESS_ANALYSIS_RETENTION_DAYS:90}
    max-contribution-rows: ${BUSINESS_ANALYSIS_MAX_CONTRIBUTION_ROWS:50}
    prompt-version: ${BUSINESS_ANALYSIS_PROMPT_VERSION:business-analysis-v1}
    generation-lease: ${BUSINESS_ANALYSIS_GENERATION_LEASE:2m}
    recovery-delay: ${BUSINESS_ANALYSIS_RECOVERY_DELAY:30s}
    recovery-batch-size: ${BUSINESS_ANALYSIS_RECOVERY_BATCH_SIZE:100}
  ai:
    provider: ${AI_PROVIDER:mock}
    max-question-length: ${AI_MAX_QUESTION_LENGTH:1000}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}
    max-tool-calls: ${AI_MAX_TOOL_CALLS:6}
    max-response-characters: ${AI_MAX_RESPONSE_CHARACTERS:50000}
    pricing:
      version: ${AI_PRICING_VERSION:2026-10-22}
      model: ${AI_PRICING_MODEL:gpt-4o-mini}
      input-usd-per-million: ${AI_INPUT_USD_PER_MILLION:0.15}
      output-usd-per-million: ${AI_OUTPUT_USD_PER_MILLION:0.60}
    resilience:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      initial-backoff: ${AI_RETRY_INITIAL_BACKOFF:200ms}
      backoff-multiplier: ${AI_RETRY_BACKOFF_MULTIPLIER:2}
      max-backoff: ${AI_RETRY_MAX_BACKOFF:1s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:10s}
    max-http-form-post-size: ${MAX_HTTP_FORM_POST_SIZE:1MB}
    max-swallow-size: ${MAX_HTTP_SWALLOW_SIZE:1MB}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=stockflow-api requestId=%X{requestId:-} logger=%logger{36} message=%msg%n"
