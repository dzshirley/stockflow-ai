name: stockflow-ai

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stockflow-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow_dev_password}
      SERVER_PORT: 8080
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-10000}
      DB_VALIDATION_TIMEOUT: ${DB_VALIDATION_TIMEOUT:-5000}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-600000}
      DB_MAX_LIFETIME: ${DB_MAX_LIFETIME:-1800000}
      DB_KEEPALIVE_TIME: ${DB_KEEPALIVE_TIME:-120000}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      HTTP_CONNECTION_TIMEOUT: ${HTTP_CONNECTION_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      MAX_HTTP_REQUEST_HEADER_SIZE: ${MAX_HTTP_REQUEST_HEADER_SIZE:-16KB}
      MAX_HTTP_FORM_POST_SIZE: ${MAX_HTTP_FORM_POST_SIZE:-1MB}
      MAX_HTTP_SWALLOW_SIZE: ${MAX_HTTP_SWALLOW_SIZE:-1MB}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_TIMEOUT: ${AI_TIMEOUT:-20s}
      AI_RETRY_MAX_ATTEMPTS: ${AI_RETRY_MAX_ATTEMPTS:-2}
      AI_RETRY_INITIAL_BACKOFF: ${AI_RETRY_INITIAL_BACKOFF:-200ms}
      AI_RETRY_BACKOFF_MULTIPLIER: ${AI_RETRY_BACKOFF_MULTIPLIER:-2}
      AI_RETRY_MAX_BACKOFF: ${AI_RETRY_MAX_BACKOFF:-1s}
      AI_MAX_TOOL_CALLS: ${AI_MAX_TOOL_CALLS:-6}
      AI_MAX_RESPONSE_TOKENS: ${AI_MAX_RESPONSE_TOKENS:-1200}
      AI_MAX_QUESTION_LENGTH: ${AI_MAX_QUESTION_LENGTH:-1000}
      AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-12}
      AI_MAX_RESPONSE_CHARACTERS: ${AI_MAX_RESPONSE_CHARACTERS:-50000}
      AI_PRICING_VERSION: ${AI_PRICING_VERSION:-2026-10-22}
      AI_PRICING_MODEL: ${AI_PRICING_MODEL:-gpt-4o-mini}
      AI_INPUT_USD_PER_MILLION: ${AI_INPUT_USD_PER_MILLION:-0.15}
      AI_OUTPUT_USD_PER_MILLION: ${AI_OUTPUT_USD_PER_MILLION:-0.60}
      BUSINESS_ANALYSIS_RETENTION_DAYS: ${BUSINESS_ANALYSIS_RETENTION_DAYS:-90}
      BUSINESS_ANALYSIS_MAX_CONTRIBUTION_ROWS: ${BUSINESS_ANALYSIS_MAX_CONTRIBUTION_ROWS:-50}
      BUSINESS_ANALYSIS_PROMPT_VERSION: ${BUSINESS_ANALYSIS_PROMPT_VERSION:-business-analysis-v1}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-15m}
      LOGIN_MAX_TRACKED_KEYS: ${LOGIN_MAX_TRACKED_KEYS:-10000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  stockflow-postgres:
