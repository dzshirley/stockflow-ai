name: Deploy approved production release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Reviewed commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to confirm the public, billable deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require explicit deployment confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          test "$CONFIRMATION" = "DEPLOY"
          test -n "$GIT_REF"

  verify:
    needs: validate-approval
    uses: ./.github/workflows/release-verify.yml
    with:
      git_ref: ${{ inputs.git_ref }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SHA: ${{ inputs.git_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}
      - name: Require immutable checked-out commit
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.git_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_REF"
      - uses: pnpm/action-setup@v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and push immutable backend image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
          docker build --pull --tag "$ECR_REPOSITORY_URL:${RELEASE_SHA}" backend
          docker push "$ECR_REPOSITORY_URL:${RELEASE_SHA}"
      - name: Publish frontend with explicit cache policy
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_REGISTRATION_ENABLED: "false"
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          aws s3 sync dist "s3://$FRONTEND_BUCKET" --delete --exclude "assets/*" --exclude "index.html" --cache-control "public,max-age=3600"
          aws s3 sync dist/assets "s3://$FRONTEND_BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"
      - name: Register immutable task revision
        env:
          ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition > current-task.json
          jq --arg image "$ECR_REPOSITORY_URL:${RELEASE_SHA}" '.containerDefinitions[0].image=$image | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' current-task.json > release-task.json
          aws ecs register-task-definition --cli-input-json file://release-task.json --query 'taskDefinition.taskDefinitionArn' --output text > task-arn.txt
      - name: Deploy backend and wait for rollback-protected health
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$(cat task-arn.txt)" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
      - name: Invalidate frontend entry point
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" >/dev/null
      - name: Verify public health over HTTPS
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test "${APP_URL#https://}" != "$APP_URL"
          curl --fail --show-error --retry 12 --retry-delay 10 "$APP_URL/api/health"
